name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release (e.g. v0.6.0)'
        required: true
        type: string

jobs:
  build-mac:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          repository: dreamwords/hammer
          ref: ${{ inputs.tag }}
          token: ${{ secrets.HAMMER_PAT }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Import code signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          echo "$CERTIFICATE_P12" | base64 --decode > certificate.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import certificate.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions build.keychain
          rm certificate.p12

      - name: Setup Apple API Key
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          echo "$APPLE_API_KEY_CONTENT" > ~/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8

      - run: npm run build

      - name: Build & sign
        run: npx electron-builder --mac
        env:
          APPLE_API_KEY: ~/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            release/*.dmg
            release/*-mac.zip
            release/*.blockmap
            release/latest-mac.yml
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-cask:
    needs: build-mac
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: ver
        run: echo "value=${TAG#v}" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ inputs.tag }}

      - name: Download DMGs and compute SHA256
        id: hashes
        env:
          V: ${{ steps.ver.outputs.value }}
        run: |
          BASE="https://github.com/${{ github.repository }}/releases/download/v${V}"
          curl -fsSL --retry 3 "${BASE}/Hammer-${V}-arm64.dmg" -o arm64.dmg
          curl -fsSL --retry 3 "${BASE}/Hammer-${V}.dmg"       -o intel.dmg
          echo "arm64=$(sha256sum arm64.dmg | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "intel=$(sha256sum intel.dmg  | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Patch cask
        env:
          V: ${{ steps.ver.outputs.value }}
          ARM64: ${{ steps.hashes.outputs.arm64 }}
          INTEL: ${{ steps.hashes.outputs.intel }}
        run: |
          sed -i \
            -e "s|version \"[^\"]*\"|version \"${V}\"|" \
            -e "/on_arm do/,/^[[:space:]]*end[[:space:]]*$/{s|sha256 \"[^\"]*\"|sha256 \"${ARM64}\"|}" \
            -e "/on_intel do/,/^[[:space:]]*end[[:space:]]*$/{s|sha256 \"[^\"]*\"|sha256 \"${INTEL}\"|}" \
            Casks/hammer.rb

      - name: Commit and push
        env:
          TAG: ${{ inputs.tag }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/hammer.rb
          git diff --quiet --cached || git commit -m "chore: bump cask to ${TAG}"
          git pull --rebase origin main
          git push
